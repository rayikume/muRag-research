name: murag
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - agno>=0.5.0
      - openai>=1.30          # OpenRouter is OpenAI-compatible; Agno uses this client
      - fastapi>=0.110
      - uvicorn[standard]>=0.27
      - duckdb>=0.10
      - "numpy<2"                       # torch 2.2.x was built against NumPy 1.x ABI
      - "torch>=2.2,<2.3"                # Intel Mac wheels stop at 2.2.2; pin to lock platform compat
      - "transformers>=4.40,<4.50"      # >=4.50 requires torch>=2.4 which isn't available on Intel Mac
      - "sentence-transformers>=2.7,<3.5"  # match transformers/torch combo above
      - loguru>=0.7
      - pydantic>=2.6
      - pydantic-settings>=2.2
      - python-dotenv>=1.0
      - pypdf>=4.0
      - httpx>=0.27
      - rich>=13.7
      - python-multipart>=0.0.9
