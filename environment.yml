      - agno>=0.5.0
      - openai>=1.30          # OpenRouter is OpenAI-compatible; Agno uses this client
      - fastapi>=0.110
      - uvicorn[standard]>=0.27
      - duckdb>=0.10
      - sentence-transformers>=2.7
      - transformers>=4.40
      - torch>=2.2
      - loguru>=0.7
      - pydantic>=2.6
      - pydantic-settings>=2.2
      - python-dotenv>=1.0
      - pypdf>=4.0
      - httpx>=0.27
      - rich>=13.7
      - python-multipart>=0.0.9
